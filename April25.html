<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Trader Joe's Shopping List</title>
  <style>
    :root {
      --bg: #f7f3ea;
      --card: #ffffff;
      --text: #243044;
      --muted: #64748b;
      --accent: #b91c1c;
      --border: #e5e7eb;
      --link: #2563eb;
      --overlay: rgba(15, 23, 42, 0.72);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    .page { max-width: 760px; margin: 0 auto; padding: 20px 16px 48px; }

    header {
      position: sticky; top: 0; z-index: 10;
      background: rgba(247, 243, 234, 0.96);
      padding: 16px 0 12px;
      border-bottom: 1px solid rgba(0,0,0,0.06);
    }

    h1 { margin: 0; }
    .subtitle { margin: 4px 0 0; color: var(--muted); }

    .section {
      margin-top: 18px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      overflow: hidden;
    }

    .section h2 { margin: 0; padding: 14px 16px; background: #fff7ed; }

    .item {
      display: flex; gap: 12px; padding: 14px 16px;
      border-bottom: 1px solid var(--border);
    }

    .item:last-child { border-bottom: none; }

    input[type="checkbox"] {
      width: 22px; height: 22px; accent-color: var(--accent);
    }

    label { flex: 1; cursor: pointer; }

    input[type="checkbox"]:checked + label {
      text-decoration: line-through; color: var(--muted);
    }

    .view-btn {
      margin-left: 8px; border: none; background: none;
      color: var(--link); cursor: pointer; text-decoration: underline;
    }

    .modal-overlay {
      display: none; position: fixed; inset: 0;
      background: var(--overlay); z-index: 1000;
      align-items: center; justify-content: center;
    }

    .modal-overlay.open { display: flex; }

    .modal {
      width: 90%; max-width: 500px;
      background: #fff; border-radius: 16px; overflow: hidden;
    }

    .modal-header {
      display: flex; justify-content: space-between;
      padding: 12px; border-bottom: 1px solid var(--border);
    }

    .modal img { width: 100%; max-height: 300px; object-fit: cover; }

  </style>
</head>
<body>
  <div class="page">
    <header>
      <h1>Trader Joe's Shopping List</h1>
      <p class="subtitle">Optimized + merged for this week's meals</p>
    </header>

    <main>

      <section class="section">
        <h2>1. Produce</h2>

        <div class="item"><input type="checkbox" id="potatoes"><label for="potatoes">Baby potatoes — 2 bags <button class="view-btn" data-name="Potatoes" data-img="https://source.unsplash.com/900x650/?potatoes">view</button></label></div>

        <div class="item"><input type="checkbox" id="cucumbers"><label for="cucumbers">Persian cucumbers — 1 pack <button class="view-btn" data-name="Cucumbers" data-img="https://source.unsplash.com/900x650/?cucumbers">view</button></label></div>

        <div class="item"><input type="checkbox" id="tomatoes"><label for="tomatoes">Cherry tomatoes — 1 container <button class="view-btn" data-name="Cherry tomatoes" data-img="https://source.unsplash.com/900x650/?cherry-tomatoes">view</button></label></div>

        <div class="item"><input type="checkbox" id="peppers"><label for="peppers">Bell peppers — 2 <button class="view-btn" data-name="Bell peppers" data-img="https://source.unsplash.com/900x650/?bell-peppers">view</button></label></div>

        <div class="item"><input type="checkbox" id="onions"><label for="onions">Onions — 2 <button class="view-btn" data-name="Onions" data-img="https://source.unsplash.com/900x650/?onions">view</button></label></div>

        <div class="item"><input type="checkbox" id="spinach"><label for="spinach">Spinach — 1 bag (5 oz) <button class="view-btn" data-name="Spinach" data-img="https://source.unsplash.com/900x650/?spinach">view</button></label></div>

        <div class="item"><input type="checkbox" id="parsley"><label for="parsley">Parsley — 1 bunch <button class="view-btn" data-name="Parsley" data-img="https://source.unsplash.com/900x650/?parsley">view</button></label></div>

        <div class="item"><input type="checkbox" id="lemon"><label for="lemon">Lemon — 1 <button class="view-btn" data-name="Lemon" data-img="https://source.unsplash.com/900x650/?lemon">view</button></label></div>

        <div class="item"><input type="checkbox" id="garlic"><label for="garlic">Garlic — 1 bulb (covers all recipes) <button class="view-btn" data-name="Garlic" data-img="https://source.unsplash.com/900x650/?garlic">view</button></label></div>

      </section>

      <section class="section">
        <h2>2. Meat</h2>

        <div class="item"><input type="checkbox" id="steak"><label for="steak">Flank steak — 1 package <button class="view-btn" data-name="Flank steak" data-img="https://source.unsplash.com/900x650/?steak">view</button></label></div>

        <div class="item"><input type="checkbox" id="beef"><label for="beef">Ground beef — 2 lb <button class="view-btn" data-name="Ground beef" data-img="https://source.unsplash.com/900x650/?ground-beef">view</button></label></div>

        <div class="item"><input type="checkbox" id="chicken"><label for="chicken">Chicken thighs — 1 pack <button class="view-btn" data-name="Chicken thighs" data-img="https://source.unsplash.com/900x650/?chicken">view</button></label></div>

      </section>

      <section class="section">
        <h2>3. Dairy</h2>

        <div class="item"><input type="checkbox" id="butter"><label for="butter">Butter — 1 package <button class="view-btn" data-name="Butter" data-img="https://source.unsplash.com/900x650/?butter">view</button></label></div>

        <div class="item"><input type="checkbox" id="cheese"><label for="cheese">Shredded cheese blend — 1 bag <button class="view-btn" data-name="Cheese" data-img="https://source.unsplash.com/900x650/?cheese">view</button></label></div>

        <div class="item"><input type="checkbox" id="cheddar"><label for="cheddar">Cheddar — 1 <button class="view-btn" data-name="Cheddar" data-img="https://source.unsplash.com/900x650/?cheddar">view</button></label></div>

        <div class="item"><input type="checkbox" id="cream"><label for="cream">Cream cheese — 1 block <button class="view-btn" data-name="Cream cheese" data-img="https://source.unsplash.com/900x650/?cream-cheese">view</button></label></div>

        <div class="item"><input type="checkbox" id="parm"><label for="parm">Parmesan — 1 container <button class="view-btn" data-name="Parmesan" data-img="https://source.unsplash.com/900x650/?parmesan">view</button></label></div>

      </section>

      <section class="section">
        <h2>4. Pantry</h2>

        <div class="item"><input type="checkbox" id="mac"><label for="mac">Macaroni — 1 box <button class="view-btn" data-name="Macaroni" data-img="https://source.unsplash.com/900x650/?macaroni">view</button></label></div>

        <div class="item"><input type="checkbox" id="orzo"><label for="orzo">Orzo — 1 box <button class="view-btn" data-name="Orzo" data-img="https://source.unsplash.com/900x650/?orzo">view</button></label></div>

        <div class="item"><input type="checkbox" id="papp"><label for="papp">Pappardelle — 1 package <button class="view-btn" data-name="Pasta" data-img="https://source.unsplash.com/900x650/?pasta">view</button></label></div>

        <div class="item"><input type="checkbox" id="broth"><label for="broth">Broth — 3 cartons (beef, chicken, vegetable) <button class="view-btn" data-name="Broth" data-img="https://source.unsplash.com/900x650/?broth">view</button></label></div>

        <div class="item"><input type="checkbox" id="soup"><label for="soup">French onion soup — 2 <button class="view-btn" data-name="Soup" data-img="https://source.unsplash.com/900x650/?soup">view</button></label></div>

        <div class="item"><input type="checkbox" id="art"><label for="art">Artichoke hearts — 1 can <button class="view-btn" data-name="Artichoke" data-img="https://source.unsplash.com/900x650/?artichoke">view</button></label></div>

        <div class="item"><input type="checkbox" id="oil"><label for="oil">Olive oil — 1 bottle <button class="view-btn" data-name="Olive oil" data-img="https://source.unsplash.com/900x650/?olive-oil">view</button></label></div>

        <div class="item"><input type="checkbox" id="dijon"><label for="dijon">Dijon — 1 <button class="view-btn" data-name="Dijon" data-img="https://source.unsplash.com/900x650/?mustard">view</button></label></div>

        <div class="item"><input type="checkbox" id="oreg"><label for="oreg">Oregano — 1 <button class="view-btn" data-name="Oregano" data-img="https://source.unsplash.com/900x650/?oregano">view</button></label></div>

      </section>

      <section class="section">
        <h2>5. Specialty</h2>

        <div class="item"><input type="checkbox" id="chim"><label for="chim">Chimichurri — 1 <button class="view-btn" data-name="Chimichurri" data-img="https://source.unsplash.com/900x650/?chimichurri">view</button></label></div>

        <div class="item"><input type="checkbox" id="chili"><label for="chili">Crunchy chili onion — 1 <button class="view-btn" data-name="Chili crisp" data-img="https://source.unsplash.com/900x650/?chili-oil">view</button></label></div>

      </section>

    </main>
  </div>

  <div class="modal-overlay" id="imageModal">
    <div class="modal">
      <div class="modal-header">
        <span id="modalTitle"></span>
        <button id="closeModal">×</button>
      </div>
      <img id="modalImage" />
    </div>
  </div>

  <script>
    const modal = document.getElementById('imageModal');
    const modalImage = document.getElementById('modalImage');
    const modalTitle = document.getElementById('modalTitle');

    document.querySelectorAll('.view-btn').forEach(btn => {
      btn.onclick = (e) => {
        e.stopPropagation();
        modalImage.src = btn.dataset.img;
        modalTitle.textContent = btn.dataset.name;
        modal.classList.add('open');
      };
    });

    document.getElementById('closeModal').onclick = () => modal.classList.remove('open');

    modal.onclick = (e) => {
      if (e.target === modal) modal.classList.remove('open');
    };
  </script>

</body>
</html>
