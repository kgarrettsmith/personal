<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Family Recipe Hub</title>
  <style>
    :root {
      --bg: #f1f5f9;
      --card: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --border: #e2e8f0;
      --accent: #0f172a;
      --soft: #f8fafc;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    a { color: inherit; }

    .page {
      max-width: 1180px;
      margin: 0 auto;
      padding: 24px;
    }

    .hero, .toolbar, .card, .detail-card, .empty {
      background: var(--card);
      border-radius: 24px;
      box-shadow: 0 1px 3px rgba(15, 23, 42, 0.08);
    }

    .hero {
      padding: 28px;
      margin-bottom: 18px;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 20px;
      align-items: end;
    }

    .eyebrow {
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      font-size: 0.78rem;
      font-weight: 700;
      margin: 0 0 10px;
    }

    h1 {
      font-size: clamp(2rem, 5vw, 3.3rem);
      line-height: 1;
      margin: 0;
      letter-spacing: -0.04em;
    }

    .hero p {
      max-width: 650px;
      color: var(--muted);
      line-height: 1.65;
      margin: 14px 0 0;
    }

    .count-box {
      background: var(--accent);
      color: white;
      padding: 18px 22px;
      border-radius: 18px;
      min-width: 140px;
    }

    .count-box strong {
      display: block;
      font-size: 2rem;
      line-height: 1;
    }

    .count-box span {
      display: block;
      margin-top: 5px;
      color: #cbd5e1;
      font-size: 0.9rem;
    }

    .toolbar {
      padding: 14px;
      margin-bottom: 20px;
      display: grid;
      grid-template-columns: 1fr 230px;
      gap: 12px;
    }

    input, select {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 13px 14px;
      font: inherit;
      background: white;
      color: var(--text);
      outline: none;
    }

    input:focus, select:focus {
      border-color: #94a3b8;
      box-shadow: 0 0 0 3px rgba(148, 163, 184, 0.25);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 16px;
    }

    .card {
      border: 1px solid transparent;
      padding: 20px;
      cursor: pointer;
      text-align: left;
      transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease;
    }

    .card:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 18px rgba(15, 23, 42, 0.09);
      border-color: var(--border);
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: flex-start;
    }

    .card h2 {
      margin: 0;
      font-size: 1.18rem;
      line-height: 1.25;
    }

    .category {
      color: var(--muted);
      font-size: 0.9rem;
      margin-top: 6px;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 5px 10px;
      font-size: 0.78rem;
      color: #475569;
      background: white;
      white-space: nowrap;
    }

    .servings-pill {
      background: var(--soft);
      border: none;
      font-weight: 700;
    }

    .description {
      color: #475569;
      line-height: 1.55;
      margin: 14px 0;
      font-size: 0.95rem;
    }

    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .back-button {
      border: none;
      background: transparent;
      color: var(--text);
      font: inherit;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      margin-bottom: 14px;
      padding: 8px 0;
    }

    .detail-wrap {
      max-width: 900px;
      margin: 0 auto;
    }

    .detail-card {
      padding: 30px;
    }

    .detail-title {
      font-size: clamp(2rem, 5vw, 3rem);
      line-height: 1;
      margin: 0;
      letter-spacing: -0.04em;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin: 24px 0;
    }

    .stat {
      background: var(--soft);
      border-radius: 18px;
      padding: 16px;
    }

    .stat-label {
      color: var(--muted);
      font-size: 0.86rem;
      margin-bottom: 4px;
    }

    .stat strong {
      font-size: 1rem;
    }

    .columns {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 32px;
      margin-top: 26px;
    }

    h3 {
      margin: 0 0 12px;
      font-size: 1.25rem;
    }

    .ingredients {
      list-style: none;
      padding: 0;
      margin: 0;
      display: grid;
      gap: 9px;
    }

    .ingredients li {
      background: var(--soft);
      border-radius: 12px;
      padding: 11px 13px;
      color: #334155;
    }

    .steps {
      padding-left: 0;
      margin: 0;
      list-style: none;
      display: grid;
      gap: 13px;
      counter-reset: steps;
    }

    .steps li {
      counter-increment: steps;
      display: grid;
      grid-template-columns: 30px 1fr;
      gap: 11px;
      line-height: 1.55;
      color: #334155;
    }

    .steps li::before {
      content: counter(steps);
      width: 28px;
      height: 28px;
      border-radius: 999px;
      background: var(--accent);
      color: white;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 0.85rem;
    }

    .notes {
      margin-top: 26px;
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 16px;
      background: white;
    }

    .notes h3 { margin-bottom: 5px; }
    .notes p { margin: 0; color: var(--muted); line-height: 1.6; }

    .source-link {
      display: inline-flex;
      margin-top: 22px;
      font-size: 0.95rem;
      color: #334155;
      font-weight: 700;
      text-decoration: underline;
      text-underline-offset: 4px;
    }

    .empty {
      padding: 30px;
      text-align: center;
      color: var(--muted);
    }

    @media (max-width: 900px) {
      .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .hero { grid-template-columns: 1fr; }
      .toolbar { grid-template-columns: 1fr; }
    }

    @media (max-width: 640px) {
      .page { padding: 14px; }
      .grid, .columns, .stats { grid-template-columns: 1fr; }
      .hero, .detail-card { padding: 22px; }
      .card-header { display: block; }
      .servings-pill { margin-top: 12px; }
    }
  </style>
</head>
<body>
  <main class="page" id="app"></main>

  <script>
    const recipes = [
      {
        id: "lemon-butter-chicken-sheet-pan",
        name: "Trader Joe's Lemon Butter Chicken Sheet Pan",
        category: "Dinner",
        source: "Frida Sofia Eats",
        sourceUrl: "https://www.fridasofiaeats.com/recipes/lemon-butter-chicken-sheet-pan",
        servings: 4,
        prepTime: "10 min",
        cookTime: "25 min",
        tags: ["Trader Joe's", "Sheet Pan", "Chicken", "Easy"],
        description: "A simple weeknight sheet pan dinner built around Trader Joe's lemon butter flavors, chicken, and vegetables.",
        ingredients: ["Chicken breast or thighs", "Trader Joe's lemon butter or lemon garlic sauce", "Baby potatoes", "Green beans or broccoli", "Olive oil", "Salt and pepper", "Lemon wedges"],
        instructions: ["Preheat oven to 400°F.", "Add chicken and vegetables to a sheet pan.", "Toss with lemon butter sauce, olive oil, salt, and pepper.", "Bake until the chicken is cooked through and the vegetables are tender.", "Serve with lemon wedges."],
        notes: "Good option for a low-effort dinner night. Add rice or orzo if you want it more filling."
      },
      {
        id: "french-onion-chicken-orzo",
        name: "Trader Joe's French Onion Chicken Orzo",
        category: "Dinner",
        source: "Frida Sofia Eats",
        sourceUrl: "https://www.fridasofiaeats.com/recipes/french-onion-chicken-orzo",
        servings: 4,
        prepTime: "10 min",
        cookTime: "25 min",
        tags: ["Trader Joe's", "Chicken", "Orzo", "Comfort Food"],
        description: "A cozy chicken and orzo dinner with French onion flavor, broth, cheese, and a creamy finish.",
        ingredients: ["Chicken breast", "Orzo pasta", "French onion soup or onion broth", "Garlic", "Butter", "Parmesan or Gruyere", "Spinach or herbs"],
        instructions: ["Cook chicken in a large skillet until browned.", "Add garlic, orzo, and broth.", "Simmer until the orzo is tender.", "Stir in cheese and greens.", "Serve warm."],
        notes: "This is a good one-pot dinner candidate. Keep extra broth nearby if the orzo absorbs too much liquid."
      },
      {
        id: "spinach-artichoke-orzo",
        name: "Trader Joe's Spinach and Artichoke Orzo",
        category: "Dinner / Vegetarian",
        source: "Frida Sofia Eats",
        sourceUrl: "https://www.fridasofiaeats.com/recipes/spinach-and-artichoke-orzo",
        servings: 4,
        prepTime: "10 min",
        cookTime: "20 min",
        tags: ["Trader Joe's", "Vegetarian", "Orzo", "Creamy"],
        description: "A creamy vegetarian orzo dish with spinach, artichokes, cream cheese, Parmesan, and lemon.",
        ingredients: ["Orzo pasta", "Garlic", "Butter", "Olive oil", "Vegetable broth", "Fresh spinach", "Artichoke hearts", "Cream cheese", "Parmesan cheese", "Lemon juice"],
        instructions: ["Cook garlic in butter and olive oil.", "Add orzo and vegetable broth.", "Simmer until orzo is tender.", "Stir in spinach, artichokes, cream cheese, Parmesan, and lemon juice.", "Serve once creamy and warmed through."],
        notes: "Can be served as a vegetarian main or as a side with chicken."
      },
      {
        id: "salsa-verde-chicken-couscous",
        name: "Trader Joe's Salsa Verde Chicken and Couscous",
        category: "Dinner",
        source: "Frida Sofia Eats",
        sourceUrl: "https://www.fridasofiaeats.com/recipes/salsa-verde-chicken-and-couscous",
        servings: 4,
        prepTime: "10 min",
        cookTime: "20 min",
        tags: ["Trader Joe's", "Chicken", "Couscous", "Quick"],
        description: "A quick chicken dinner using salsa verde, couscous, and simple toppings.",
        ingredients: ["Chicken breast", "Salsa verde", "Couscous", "Chicken broth", "Corn", "Black beans", "Lime", "Cilantro", "Cheese or avocado"],
        instructions: ["Cook chicken in a skillet.", "Add salsa verde and simmer.", "Prepare couscous with broth.", "Combine chicken, couscous, corn, and beans.", "Top with lime, cilantro, cheese, or avocado."],
        notes: "Good for leftovers and easy to customize."
      },
      {
        id: "soyaki-beef-bowl",
        name: "Trader Joe's Soyaki Beef Bowl",
        category: "Dinner",
        source: "Frida Sofia Eats",
        sourceUrl: "https://www.fridasofiaeats.com/recipes/soyaki-beef-bowl",
        servings: 4,
        prepTime: "10 min",
        cookTime: "15 min",
        tags: ["Trader Joe's", "Beef", "Rice Bowl", "Quick"],
        description: "A fast rice bowl with beef, vegetables, and Trader Joe's Soyaki sauce.",
        ingredients: ["Beef strips or ground beef", "Trader Joe's Soyaki sauce", "Rice", "Broccoli or stir-fry vegetables", "Green onions", "Sesame seeds", "Sriracha or chili crunch"],
        instructions: ["Cook rice according to package directions.", "Brown beef in a skillet.", "Add vegetables and Soyaki sauce.", "Cook until vegetables are tender and sauce coats the beef.", "Serve over rice with green onions and sesame seeds."],
        notes: "One of the fastest weeknight options."
      }
    ];

    const app = document.getElementById("app");
    let selectedRecipeId = null;
    let searchQuery = "";
    let selectedCategory = "All";

    function escapeHtml(value) {
      return String(value).replace(/[&<>'"]/g, char => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        "'": "&#39;",
        '"': "&quot;"
      }[char]));
    }

    function getCategories() {
      return ["All", ...new Set(recipes.map(recipe => recipe.category))];
    }

    function getFilteredRecipes() {
      const q = searchQuery.trim().toLowerCase();
      return recipes.filter(recipe => {
        const matchesCategory = selectedCategory === "All" || recipe.category === selectedCategory;
        const text = [recipe.name, recipe.category, recipe.description, ...recipe.tags, ...recipe.ingredients].join(" ").toLowerCase();
        return matchesCategory && text.includes(q);
      });
    }

    function renderList() {
      const filtered = getFilteredRecipes();
      const categories = getCategories();

      app.innerHTML = `
        <section class="hero">
          <div>
            <p class="eyebrow">Family Recipe Hub</p>
            <h1>What should we eat this week?</h1>
            <p>A curated family recipe list with quick filters, searchable ingredients, and full recipe pages.</p>
          </div>
          <div class="count-box">
            <strong>${recipes.length}</strong>
            <span>saved recipes</span>
          </div>
        </section>

        <section class="toolbar">
          <input id="searchInput" type="search" placeholder="Search by recipe, ingredient, or tag..." value="${escapeHtml(searchQuery)}" />
          <select id="categorySelect">
            ${categories.map(category => `<option value="${escapeHtml(category)}" ${category === selectedCategory ? "selected" : ""}>${escapeHtml(category)}</option>`).join("")}
          </select>
        </section>

        ${filtered.length ? `
          <section class="grid">
            ${filtered.map(recipe => `
              <article class="card" data-recipe-id="${escapeHtml(recipe.id)}">
                <div class="card-header">
                  <div>
                    <h2>${escapeHtml(recipe.name)}</h2>
                    <div class="category">${escapeHtml(recipe.category)}</div>
                  </div>
                  <span class="pill servings-pill">${recipe.servings} servings</span>
                </div>
                <p class="description">${escapeHtml(recipe.description)}</p>
                <div class="tags">
                  ${recipe.tags.slice(0, 4).map(tag => `<span class="pill">${escapeHtml(tag)}</span>`).join("")}
                </div>
              </article>
            `).join("")}
          </section>
        ` : `<div class="empty">No recipes found. Try a different search or category.</div>`}
      `;

      document.getElementById("searchInput").addEventListener("input", event => {
        searchQuery = event.target.value;
        renderList();
      });

      document.getElementById("categorySelect").addEventListener("change", event => {
        selectedCategory = event.target.value;
        renderList();
      });

      document.querySelectorAll(".card").forEach(card => {
        card.addEventListener("click", () => {
          selectedRecipeId = card.dataset.recipeId;
          renderDetail();
          window.scrollTo({ top: 0, behavior: "smooth" });
        });
      });
    }

    function renderDetail() {
      const recipe = recipes.find(item => item.id === selectedRecipeId);
      if (!recipe) {
        selectedRecipeId = null;
        renderList();
        return;
      }

      app.innerHTML = `
        <div class="detail-wrap">
          <button class="back-button" id="backButton">← Back to recipes</button>
          <article class="detail-card">
            <p class="eyebrow">${escapeHtml(recipe.category)}</p>
            <h1 class="detail-title">${escapeHtml(recipe.name)}</h1>
            <p class="description">${escapeHtml(recipe.description)}</p>

            <div class="stats">
              <div class="stat"><div class="stat-label">Servings</div><strong>${recipe.servings}</strong></div>
              <div class="stat"><div class="stat-label">Prep</div><strong>${escapeHtml(recipe.prepTime)}</strong></div>
              <div class="stat"><div class="stat-label">Cook</div><strong>${escapeHtml(recipe.cookTime)}</strong></div>
            </div>

            <div class="tags">
              ${recipe.tags.map(tag => `<span class="pill">${escapeHtml(tag)}</span>`).join("")}
            </div>

            <div class="columns">
              <section>
                <h3>Ingredients</h3>
                <ul class="ingredients">
                  ${recipe.ingredients.map(item => `<li>${escapeHtml(item)}</li>`).join("")}
                </ul>
              </section>

              <section>
                <h3>Instructions</h3>
                <ol class="steps">
                  ${recipe.instructions.map(step => `<li>${escapeHtml(step)}</li>`).join("")}
                </ol>
              </section>
            </div>

            ${recipe.notes ? `
              <section class="notes">
                <h3>Family Notes</h3>
                <p>${escapeHtml(recipe.notes)}</p>
              </section>
            ` : ""}

            <a class="source-link" href="${escapeHtml(recipe.sourceUrl)}" target="_blank" rel="noreferrer">
              View original recipe at ${escapeHtml(recipe.source)} ↗
            </a>
          </article>
        </div>
      `;

      document.getElementById("backButton").addEventListener("click", () => {
        selectedRecipeId = null;
        renderList();
      });
    }

    renderList();
  </script>
</
