<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>What Is For Dinner?</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
      background: #111;
      color: #eee;
    }

    button {
      padding: 10px 14px;
      margin-right: 10px;
      cursor: pointer;
    }

    .card {
      border: 1px solid #333;
      padding: 16px;
      margin: 12px 0;
      border-radius: 8px;
      cursor: pointer;
      background: #1a1a1a;
    }

    .card:hover {
      background: #222;
    }

    input[type="checkbox"] {
      width: 22px;
      height: 22px;
      cursor: pointer;
    }

    .shopping-list-page input[type="checkbox"] {
      width: 30px;
      height: 30px;
    }

    @media print {
      body {
        background: white;
        color: black;
      }

      button {
        display: none;
      }
    }
  </style>
</head>

<body>

  <div id="app"></div>

  <!-- ✅ LOAD DATA FIRST -->
  <script src="recipes-data.js"></script>

  <!-- ✅ MAIN APP LOGIC -->
  <script>
    const app = document.getElementById("app");

    let selectedMealIds = [];

    function renderList() {
      app.innerHTML = `
        <div style="margin-bottom:20px;">
          <button id="chooseFiveBtn">Choose 5</button>
          <button id="makeListBtn">Make a List</button>
          <button id="resetBtn">Reset</button>
        </div>

        ${recipes.map(recipe => `
          <div class="card" data-id="${recipe.id}">
            <label onclick="event.stopPropagation()">
              <input type="checkbox" class="meal-checkbox" data-id="${recipe.id}">
              Select
            </label>
            <h3>${recipe.name}</h3>
            <p>${recipe.category}</p>
          </div>
        `).join("")}
      `;

      // checkbox logic
      document.querySelectorAll(".meal-checkbox").forEach(box => {
        box.addEventListener("change", e => {
          const id = e.target.dataset.id;
          if (e.target.checked) {
            selectedMealIds.push(id);
          } else {
            selectedMealIds = selectedMealIds.filter(x => x !== id);
          }
        });
      });

      // make list
      document.getElementById("makeListBtn").addEventListener("click", () => {
        const selectedMeals = recipes.filter(r => selectedMealIds.includes(r.id));
        renderShoppingPage(selectedMeals);
      });

      // reset
      document.getElementById("resetBtn").addEventListener("click", () => {
        selectedMealIds = [];
        renderList();
      });

      // choose 5
      document.getElementById("chooseFiveBtn").addEventListener("click", () => {
        const picked = [...recipes].sort(() => 0.5 - Math.random()).slice(0, 5);
        alert(picked.map(r => r.name).join("\n"));
      });
    }

    function renderShoppingPage(meals) {
      const allIngredients = [];

      meals.forEach(meal => {
        meal.ingredients.forEach(i => {
          allIngredients.push(i.name);
        });
      });

      app.innerHTML = `
        <div style="margin-bottom:20px;">
          <button id="backBtn">Back</button>
          <button onclick="window.print()">Print</button>
        </div>

        <h1>Grocery List</h1>

        <ul class="shopping-list-page">
          ${allIngredients.map(i => `
            <li>
              <input type="checkbox"> ${i}
            </li>
          `).join("")}
        </ul>
      `;

      document.getElementById("backBtn").addEventListener("click", renderList);
    }

    // init
    renderList();
  </script>

</body>
</html>
