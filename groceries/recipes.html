<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Family Recipe Hub</title>
  <style>
    :root {
      --bg: #090015;
      --card: #16002a;
      --text: #f8f7ff;
      --muted: #9ffcff;
      --border: #ff4fd8;
      --accent: #00f5ff;
      --soft: #22003f;
      --pink: #ff4fd8;
      --yellow: #fff56b;
      --green: #39ff14;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "Courier New", Courier, monospace;
      background:
        linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px),
        radial-gradient(circle at top, #28105f 0%, #090015 48%, #030008 100%);
      background-size: 24px 24px, 24px 24px, cover;
      color: var(--text);
      min-height: 100vh;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background: repeating-linear-gradient(
        to bottom,
        rgba(255,255,255,0.05),
        rgba(255,255,255,0.05) 1px,
        transparent 1px,
        transparent 4px
      );
      mix-blend-mode: overlay;
      opacity: 0.35;
      z-index: 999;
    }

    a { color: inherit; }

    .page {
      max-width: 1180px;
      margin: 0 auto;
      padding: 24px;
    }

    .hero, .toolbar, .card, .detail-card, .empty {
      background: linear-gradient(180deg, rgba(22,0,42,0.96), rgba(9,0,21,0.96));
      border: 3px solid var(--border);
      border-radius: 0;
      box-shadow: 0 0 0 4px #05000d, 0 0 22px rgba(255,79,216,0.65), inset 0 0 18px rgba(0,245,255,0.12);
    }

    .hero {
      padding: 28px;
      margin-bottom: 20px;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 20px;
      align-items: end;
      position: relative;
      overflow: hidden;
    }

    .hero::after {
      content: "PRESS START";
      position: absolute;
      right: 24px;
      top: 18px;
      color: var(--yellow);
      font-size: 0.8rem;
      text-shadow: 0 0 8px var(--yellow);
      animation: blink 1.1s steps(2, start) infinite;
    }

    @keyframes blink { 50% { opacity: 0.2; } }

    .eyebrow {
      color: var(--green);
      text-transform: uppercase;
      letter-spacing: 0.12em;
      font-size: 0.82rem;
      font-weight: 700;
      margin: 0 0 10px;
      text-shadow: 0 0 8px var(--green);
    }

    h1 {
      font-size: clamp(2rem, 5vw, 3.3rem);
      line-height: 1;
      margin: 0;
      letter-spacing: -0.04em;
      color: var(--yellow);
      text-transform: uppercase;
      text-shadow: 4px 4px 0 #000, 0 0 14px var(--yellow), 0 0 28px var(--pink);
    }

    .hero p {
      max-width: 650px;
      color: var(--muted);
      line-height: 1.65;
      margin: 14px 0 0;
      text-shadow: 0 0 8px rgba(0,245,255,0.8);
    }

    .hero img {
      border: 4px solid var(--accent) !important;
      border-radius: 0 !important;
      image-rendering: auto;
      box-shadow: 0 0 16px var(--accent), 6px 6px 0 #000;
    }

    .count-box {
      background: #05000d;
      color: white;
      padding: 18px 22px;
      border-radius: 0;
      min-width: 140px;
      border: 3px solid var(--accent);
      box-shadow: 0 0 14px var(--accent);
    }

    .count-box strong {
      display: block;
      font-size: 2rem;
      line-height: 1;
      color: var(--yellow);
      text-shadow: 0 0 10px var(--yellow);
    }

    .count-box span {
      display: block;
      margin-top: 5px;
      color: var(--muted);
      font-size: 0.9rem;
    }

    .toolbar {
      padding: 14px;
      margin-bottom: 22px;
      display: grid;
      grid-template-columns: 1fr 230px;
      gap: 12px;
    }

    input, select {
      width: 100%;
      border: 3px solid var(--accent);
      border-radius: 0;
      padding: 13px 14px;
      font: inherit;
      background: #05000d;
      color: var(--yellow);
      outline: none;
      box-shadow: inset 0 0 12px rgba(0,245,255,0.2);
    }

    input::placeholder { color: rgba(159,252,255,0.65); }

    input:focus, select:focus {
      border-color: var(--yellow);
      box-shadow: 0 0 16px var(--yellow), inset 0 0 12px rgba(255,245,107,0.14);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 18px;
    }

    .card {
      padding: 20px;
      cursor: pointer;
      text-align: left;
      transition: transform 0.12s ease, box-shadow 0.12s ease, border-color 0.12s ease;
    }

    .card:hover {
      transform: translateY(-4px);
      border-color: var(--yellow);
      box-shadow: 0 0 0 4px #05000d, 0 0 24px rgba(255,245,107,0.75), inset 0 0 18px rgba(255,245,107,0.12);
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: flex-start;
    }

    .card h2 {
      margin: 0;
      font-size: 1.18rem;
      line-height: 1.25;
      color: var(--yellow);
      text-shadow: 2px 2px 0 #000, 0 0 8px var(--yellow);
      text-transform: uppercase;
    }

    .category {
      color: var(--muted);
      font-size: 0.9rem;
      margin-top: 6px;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      border: 2px solid var(--accent);
      border-radius: 0;
      padding: 5px 10px;
      font-size: 0.78rem;
      color: var(--muted);
      background: #05000d;
      white-space: nowrap;
      box-shadow: 0 0 8px rgba(0,245,255,0.35);
    }

    .servings-pill {
      background: #05000d;
      border: 2px solid var(--green);
      color: var(--green);
      font-weight: 700;
      box-shadow: 0 0 8px rgba(57,255,20,0.45);
    }

    .description {
      color: #d8faff;
      line-height: 1.55;
      margin: 14px 0;
      font-size: 0.95rem;
    }

    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .back-button {
      border: 3px solid var(--accent);
      background: #05000d;
      color: var(--yellow);
      font: inherit;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      margin-bottom: 16px;
      padding: 10px 14px;
      box-shadow: 0 0 12px var(--accent);
      text-transform: uppercase;
    }

    .detail-wrap {
      max-width: 900px;
      margin: 0 auto;
    }

    .detail-card {
      padding: 30px;
    }

    .detail-title {
      font-size: clamp(2rem, 5vw, 3rem);
      line-height: 1;
      margin: 0;
      letter-spacing: -0.04em;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin: 24px 0;
    }

    .stat {
      background: #05000d;
      border: 2px solid var(--accent);
      border-radius: 0;
      padding: 16px;
      box-shadow: inset 0 0 12px rgba(0,245,255,0.2);
    }

    .stat-label {
      color: var(--muted);
      font-size: 0.86rem;
      margin-bottom: 4px;
      text-transform: uppercase;
    }

    .stat strong {
      font-size: 1rem;
      color: var(--yellow);
    }

    .columns {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 32px;
      margin-top: 26px;
    }

    h3 {
      margin: 0 0 12px;
      font-size: 1.25rem;
      color: var(--green);
      text-transform: uppercase;
      text-shadow: 0 0 8px var(--green);
    }

    .ingredients {
      list-style: none;
      padding: 0;
      margin: 0;
      display: grid;
      gap: 9px;
    }

    .ingredients li {
      background: #05000d;
      border: 2px solid rgba(0,245,255,0.75);
      border-radius: 0;
      padding: 11px 13px;
      color: #d8faff;
    }

    .steps {
      padding-left: 0;
      margin: 0;
      list-style: none;
      display: grid;
      gap: 13px;
      counter-reset: steps;
    }

    .steps li {
      counter-increment: steps;
      display: grid;
      grid-template-columns: 34px 1fr;
      gap: 11px;
      line-height: 1.55;
      color: #d8faff;
    }

    .steps li::before {
      content: counter(steps);
      width: 30px;
      height: 30px;
      border-radius: 0;
      background: var(--pink);
      color: #05000d;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 0.9rem;
      box-shadow: 0 0 10px var(--pink);
    }

    .notes {
      margin-top: 26px;
      border: 3px solid var(--yellow);
      border-radius: 0;
      padding: 16px;
      background: #05000d;
      box-shadow: 0 0 14px rgba(255,245,107,0.45);
    }

    .notes h3 { margin-bottom: 5px; }
    .notes p { margin: 0; color: #d8faff; line-height: 1.6; }

    .source-link {
      display: inline-flex;
      margin-top: 22px;
      font-size: 0.95rem;
      color: var(--yellow);
      font-weight: 700;
      text-decoration: underline;
      text-underline-offset: 4px;
      text-shadow: 0 0 8px var(--yellow);
    }

    .empty {
      padding: 30px;
      text-align: center;
      color: var(--muted);
    }

    @media (max-width: 900px) {
      .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .hero { grid-template-columns: 1fr; }
      .toolbar { grid-template-columns: 1fr; }
    }

    @media (max-width: 640px) {
      .page { padding: 14px; }
      .grid, .columns, .stats { grid-template-columns: 1fr; }
      .hero, .detail-card { padding: 22px; }
      .card-header { display: block; }
      .servings-pill { margin-top: 12px; }
    }
  </style>
</head>

    const app = document.getElementById("app");
    let selectedRecipeId = null;
    let searchQuery = "";
    let selectedCategory = "All";

    function escapeHtml(value) {
      return String(value).replace(/[&<>'"]/g, char => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        "'": "&#39;",
        '"': "&quot;"
      }[char]));
    }

    function getCategories() {
      return ["All", ...new Set(recipes.map(recipe => recipe.category))];
    }

    function getFilteredRecipes() {
      const q = searchQuery.trim().toLowerCase();
      return recipes.filter(recipe => {
        const matchesCategory = selectedCategory === "All" || recipe.category === selectedCategory;
        const text = [recipe.name, recipe.category, recipe.description, ...recipe.tags, ...recipe.ingredients].join(" ").toLowerCase();
        return matchesCategory && text.includes(q);
      });
    }

          <input id="searchInput" type="search" placeholder="Search by recipe, ingredient, or tag..." value="${escapeHtml(searchQuery)}" />
          <select id="categorySelect">
            ${categories.map(category => `<option value="${escapeHtml(category)}" ${category === selectedCategory ? "selected" : ""}>${escapeHtml(category)}</option>`).join("")}
          </select>
        </section>

        ${filtered.length ? `
          <section class="grid">
            ${filtered.map(recipe => `
              <article class="card" data-recipe-id="${escapeHtml(recipe.id)}">
                <div class="card-header">
                  <div>
                    <h2>${escapeHtml(recipe.name)}</h2>
                    <div class="category">${escapeHtml(recipe.category)}</div>
                  </div>
                  <span class="pill servings-pill">${recipe.servings} servings</span>
                </div>
                <p class="description">${escapeHtml(recipe.description)}</p>
                <div class="tags">
                  ${recipe.tags.slice(0, 4).map(tag => `<span class="pill">${escapeHtml(tag)}</span>`).join("")}
                </div>
              </article>
            `).join("")}
          </section>
        ` : `<div class="empty">No recipes found. Try a different search or category.</div>`}
      `;

      document.getElementById("searchInput").addEventListener("input", event => {
        searchQuery = event.target.value;
        renderList();
      });

      document.getElementById("categorySelect").addEventListener("change", event => {
        selectedCategory = event.target.value;
        renderList();
      });

      document.querySelectorAll(".card").forEach(card => {
        card.addEventListener("click", () => {
          selectedRecipeId = card.dataset.recipeId;
          renderDetail();
          window.scrollTo({ top: 0, behavior: "smooth" });
        });
      });
    }

    function renderDetail() {
      const recipe = recipes.find(item => item.id === selectedRecipeId);
      if (!recipe) {
        selectedRecipeId = null;
        renderList();
        return;
      }

      app.innerHTML = `
        <div class="detail-wrap">
          <button class="back-button" id="backButton">← Back to recipes</button>
          <article class="detail-card">
            <p class="eyebrow">${escapeHtml(recipe.category)}</p>
            <h1 class="detail-title">${escapeHtml(recipe.name)}</h1>
            <p class="description">${escapeHtml(recipe.description)}</p>

            <div class="stats">
              <div class="stat"><div class="stat-label">Servings</div><strong>${recipe.servings}</strong></div>
              <div class="stat"><div class="stat-label">Prep</div><strong>${escapeHtml(recipe.prepTime)}</strong></div>
              <div class="stat"><div class="stat-label">Cook</div><strong>${escapeHtml(recipe.cookTime)}</strong></div>
            </div>

            <div class="tags">
              ${recipe.tags.map(tag => `<span class="pill">${escapeHtml(tag)}</span>`).join("")}
            </div>

            <div class="columns">
              <section>
                <h3>Ingredients</h3>
                <ul class="ingredients">
                  ${recipe.ingredients.map(item => `<li>${escapeHtml(item)}</li>`).join("")}
                </ul>
              </section>

              <section>
                <h3>Instructions</h3>
                <ol class="steps">
                  ${recipe.instructions.map(step => `<li>${escapeHtml(step)}</li>`).join("")}
                </ol>
              </section>
            </div>

            ${recipe.notes ? `
              <section class="notes">
                <h3>Family Notes</h3>
                <p>${escapeHtml(recipe.notes)}</p>
              </section>
            ` : ""}

            <a class="source-link" href="${escapeHtml(recipe.sourceUrl)}" target="_blank" rel="noreferrer">
              View original recipe at ${escapeHtml(recipe.source)} ↗
            </a>
          </article>
        </div>
      `;

      document.getElementById("backButton").addEventListener("click", () => {
        selectedRecipeId = null;
        renderList();
      });
    }

    renderList();
  </script>
</body>
</html>
